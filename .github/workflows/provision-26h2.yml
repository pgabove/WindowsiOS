# Installs Windows 11 26H2 Arm64 under the engine's macOS build on a GitHub-hosted Apple Silicon
# runner, the way scripts/provision_windows_arm64.py does it on a Mac, then:
#
#   1. packs and compresses the finished disk and uploads it, in parts, to a DRAFT release. A
#      draft release is shown only to people with write access to this repository. It must stay
#      a draft: it holds Microsoft's Windows files, which are not ours to hand out.
#   2. joins the parts again with the code the iPad app uses, unpacks them and boots the result
#      once, as a check of the very files that were uploaded.
#
# The Windows media comes straight from Microsoft's Media Creation Tool catalog.
#
# The UEFI firmware shipped with the image is built by the "firmware" job (firmware/build.sh): QEMU's
# EDK2 build plus the patch that lets the iPad app choose Windows' screen resolution. The install
# itself runs on QEMU's prebuilt firmware; the check boots use the new one, at the Smooth and Sharp
# resolutions of a 13-inch iPad Pro.
#
# While the job runs, the branch "ci-status" holds the current guest screenshot and a status
# text (see .github/scripts/ci_status.sh). Nothing from Windows itself goes into artifacts or
# branches: only logs and screenshots.
#
# Starts by hand from the Actions tab, or when this file changes on the ipad-26h2 branch.

name: Provision Windows 11 26H2 image

on:
  workflow_dispatch: {}
  push:
    branches: [ ipad-26h2 ]
    paths:
      - .github/workflows/provision-26h2.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: provision-26h2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    uses: ./.github/workflows/firmware.yml

  provision:
    runs-on: xcode-27
    timeout-minutes: 355
    defaults:
      run:
        shell: bash
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      GH_TOKEN: ${{ github.token }}
      # Written into unattend.xml: the local account (no password) and the PC name.
      WINIOS_USER: User
      WINIOS_COMPUTER: IPAD-PRO
      # Windows system disk. The file is sparse, so the size costs nothing until Windows fills it.
      WINIOS_DISK_GB: "64"
      WINIOS_INSTALLER_MB: "9000"

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Runner facts and disk space
        run: |
          set -uo pipefail
          sw_vers
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          python3 --version
          gh --version | head -n 1
          df -g /
          free_gb="$(df -g / | awk 'NR==2{print $4}')"
          if [ "$free_gb" -lt 60 ]; then
            echo "Only ${free_gb} GB free: removing the Xcode versions and SDKs this job does not use"
            keep="$(cd "$(xcode-select -p)/../.." && pwd -P)"
            for x in /Applications/Xcode*.app; do
              [ -L "$x" ] && continue
              [ "$(cd "$x" && pwd -P)" = "$keep" ] && continue
              echo "  removing $x"
              sudo rm -rf "$x"
            done
            rm -rf "$HOME/Library/Android/sdk" || true
            xcrun simctl delete all >/dev/null 2>&1 || true
            xcrun simctl runtime delete all >/dev/null 2>&1 || true
            sudo rm -rf /Library/Developer/CoreSimulator/Caches/* /Library/Developer/CoreSimulator/Images/* >/dev/null 2>&1 || true
            rm -rf "$HOME/Library/Developer/Xcode/DerivedData" "$HOME/Library/Developer/CoreSimulator/Devices" >/dev/null 2>&1 || true
            sleep 20
            df -g /
          fi

      # Fails in the first minute, not after hours, if this job may not create draft releases.
      - name: "Preflight: draft release and status branch"
        run: |
          set -euo pipefail
          tag="ipad-26h2-preflight-${GITHUB_RUN_ID}"
          echo "preflight for run ${GITHUB_RUN_NUMBER}" > "$RUNNER_TEMP/preflight.txt"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "preflight (temporary, safe to delete)" --notes "temporary" "$RUNNER_TEMP/preflight.txt"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,assets \
            --jq '"draft=\(.isDraft) assets=\(.assets | length)"'
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          mkdir -p work/status
          echo "run ${GITHUB_RUN_NUMBER} commit ${GITHUB_SHA:0:12}: job started $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > work/status/status.txt
          .github/scripts/ci_status.sh work/status

      - name: Install tools
        run: |
          set -euxo pipefail
          brew install wimlib qemu libslirp pkg-config cabextract
          ls -l /opt/homebrew/share/qemu/edk2-aarch64-code.fd /opt/homebrew/share/qemu/edk2-arm-vars.fd

      - name: Build winvm and run the engine's unit tests
        run: |
          set -euo pipefail
          make -j"$(sysctl -n hw.ncpu)" all
          make test-core
          clang -O2 -Wall -Wextra -Iios/Sources/Native tools/partstool.c ios/Sources/Native/winios_parts.c \
            -lcompression -o build/partstool
          .github/scripts/test_partstool.sh build/partstool
          ls -l build/winvm build/hvsparse build/partstool

      - name: Fetch the Windows 11 26H2 Arm64 ESD from Microsoft
        run: |
          set -euo pipefail
          mkdir -p work/downloads
          python3 scripts/ci_fetch_win11_esd.py --build-prefix 26300 --download work/downloads | tee work/fetch.log
          esd="$(grep '^ESD_PATH=' work/fetch.log | cut -d= -f2-)"
          test -s "$esd"
          wimlib-imagex info "$esd" > work/esd_info.txt
          awk '/^Index:/{i=$2} /^Name:/{sub(/^Name:[ \t]*/,""); print i": "$0}' work/esd_info.txt | tee work/esd_images.txt
          grep -E "^(Build|Service Pack Build):" work/esd_info.txt | sort | uniq -c || true
          grep -q '^2: .*Windows PE' work/esd_images.txt || { echo "::error::image 2 of the ESD is not Windows PE"; exit 1; }
          grep -q '^[0-9]*: Windows 11 Pro$' work/esd_images.txt || { echo "::error::no 'Windows 11 Pro' image in the ESD"; exit 1; }
          echo "WINIOS_ESD=$esd" >> "$GITHUB_ENV"
          echo "WINIOS_ESD_IMAGE=Windows 11 Pro" >> "$GITHUB_ENV"

      # Windows on Arm loads only Microsoft-signed kernel drivers (unless test signing is on), so the
      # attestation-signed virtio-win build is preferred over the stable ISO.
      - name: Fetch the NetKVM network driver (virtio-win)
        continue-on-error: true
        run: .github/scripts/fetch_netkvm.sh

      - name: Check the Windows tuning scripts parse
        run: |
          pwsh -NoProfile -Command '
            $bad = 0
            foreach ($f in Get-ChildItem scripts/windows/*.ps1) {
              $errs = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
              if ($errs) { $errs | ForEach-Object { Write-Host "$($f.Name): $($_.Message) (line $($_.Extent.StartLineNumber))" }; $bad++ }
              else { Write-Host "$($f.Name): parses" }
            }
            exit $bad'

      - name: Build the installer image
        run: |
          set -euo pipefail
          python3 scripts/provision_windows_arm64.py --installer-only
          ls -l work/ipad_stage
          dev="$(hdiutil attach -imagekey diskimage-class=CRawDiskImage -nobrowse work/installer_v4.img | awk 'NR==1{print $1}')"
          diskutil list "$dev"
          ls -l /Volumes/WINPE /Volumes/WINPE/sources /Volumes/WINWIM/sources
          wimlib-imagex dir /Volumes/WINPE/sources/boot.wim 1 --path=/Drivers || true
          wimlib-imagex extract /Volumes/WINPE/sources/boot.wim 1 /Windows/System32/startnet.cmd --dest-dir="$RUNNER_TEMP" --no-acls || true
          grep -n "GB" "$RUNNER_TEMP/startnet.cmd" || true
          wimlib-imagex info /Volumes/WINWIM/sources/install.wim | grep -E "^(Name|Build|Service Pack Build|Architecture):" || true
          hdiutil detach "$dev"
          rm -f "$WINIOS_ESD" work/ipad_stage/installer.img
          df -g /

      - name: "Phase 1: WinPE applies the image"
        timeout-minutes: 130
        run: python3 .github/scripts/ci_phase.py phase1 120

      - name: Phase 1 result
        if: always()
        continue-on-error: true
        run: |
          set +e +o pipefail
          shots="$(ls work/shots/phase1_*.png 2>/dev/null | tail -n 2 | tr '\n' ' ')"
          .github/scripts/ci_show.sh work/prov_phase1_dism.log $shots work/prov_phase1.png
          du -sh work/windows11.img 2>/dev/null || true

      - name: "Phase 2: first boot, setup, first logon, shutdown"
        timeout-minutes: 160
        run: python3 .github/scripts/ci_phase.py phase2 150

      - name: Phase 2 result
        if: always()
        continue-on-error: true
        run: |
          set +e +o pipefail
          shots="$(ls work/shots/phase2_*.png 2>/dev/null | tail -n 3 | tr '\n' ' ')"
          .github/scripts/ci_show.sh work/prov_phase2_oobe.log $shots work/prov_phase2.png
          du -sh work/windows11.img 2>/dev/null || true

      - name: Pack the disk and split it into parts
        run: |
          set -euo pipefail
          rm -f work/installer_v4.img
          build/hvsparse pack work/windows11.img work/windows11.hvsparse
          ls -l work/windows11.hvsparse
          rm -f work/windows11.img
          mkdir -p work/release
          build/partstool split work/windows11.hvsparse 1900 work/release lzfse
          rm -f work/windows11.hvsparse
          cat work/release/windows11.hvsparse.parts
          cp work/code.fd work/release/code.fd
          cp work/vars_clean.fd work/release/vars.fd
          ( cd work/release && shasum -a 256 * > ../SHA256SUMS.txt )
          cat work/SHA256SUMS.txt
          df -g /

      - name: Get the resolution-aware firmware (firmware job)
        continue-on-error: true
        run: |
          set -uo pipefail
          for i in $(seq 1 40); do
            if gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" -n winios-uefi-firmware -D work/fw 2>/dev/null; then
              break
            fi
            sleep 30
          done
          if [ -s work/fw/code.fd ] && [ "$(stat -f %z work/fw/code.fd)" = 67108864 ]; then
            cat work/fw/code.fd.sha256
            cp work/fw/code.fd work/release/code.fd
            echo "FW_OK=1" >> "$GITHUB_ENV"
          else
            echo "::warning::no firmware from the firmware job; shipping QEMU's (fixed 800x600 screen)"
          fi

      - name: Upload to a draft release (shown only to the repository owner)
        run: |
          set -euo pipefail
          tag="ipad-26h2-image-${GITHUB_RUN_NUMBER}"
          # Earlier drafts stay (someone may be downloading one); delete them on GitHub when done.
          gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft) | "existing draft: \(.name)"' || true
          media="$(grep -m1 '^Selected:' work/fetch.log | sed 's/^Selected: //' || true)"
          {
            echo "Windows 11 26H2 Arm64, installed and set up by the Provision workflow (run ${GITHUB_RUN_NUMBER})."
            echo
            echo "Keep this release a DRAFT. It holds Microsoft's Windows files and is for the repository owner only."
            echo "Windows is not activated: it needs your own licence."
            echo
            if [ -n "${FW_OK:-}" ]; then
              echo "code.fd lets the app choose the screen resolution (Smooth or Sharp in the app)."
            else
              echo "code.fd is QEMU's firmware (800x600 screen)."
            fi
            echo
            echo "Source media: ${media}"
            echo
            cat work/netkvm_source.txt 2>/dev/null || echo "NetKVM: none (no network adapter driver)"
            echo
            echo "Put every file in Files > On My iPad > Windows 11 > Machines > Win11, then open the app."
          } > work/notes.md
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "PRIVATE DRAFT - Windows 11 26H2 image for iPad (run ${GITHUB_RUN_NUMBER}) - do not publish" \
            --notes-file work/notes.md \
            work/release/code.fd work/release/vars.fd work/release/windows11.hvsparse.parts
          for f in work/release/windows11.hvsparse.[0-9][0-9][0-9]; do
            ok=0
            for attempt in 1 2 3; do
              if gh release upload "$tag" "$f" --repo "$GITHUB_REPOSITORY" --clobber; then ok=1; break; fi
              echo "upload of $f failed (attempt $attempt)"; sleep 15
            done
            [ "$ok" = 1 ] || { echo "::error::could not upload $f"; exit 1; }
            echo "uploaded $(basename "$f")"
          done
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,assets \
            --jq '"draft=\(.isDraft) assets=\(.assets | length)", (.assets[] | "  \(.name) \(.size)")'

      - name: Check the uploaded files end to end (join, unpack, boot)
        timeout-minutes: 50
        run: |
          set +e
          # The same join code as the app: checks every part's SHA-256, decompresses, removes the parts.
          build/partstool join work/release windows11.hvsparse || { echo "::error::joining the parts failed"; exit 1; }
          build/hvsparse unpack work/release/windows11.hvsparse work/check.img || { echo "::error::unpack failed"; exit 1; }
          rm -f work/release/windows11.hvsparse
          if [ -n "${FW_OK:-}" ]; then
            PHASE3_TAG=smooth PHASE3_FB=1376x1032 PHASE3_TESTS=full \
              .github/scripts/ci_phase3.sh "$PWD/work/check.img" "$PWD/work/release/code.fd" "$PWD/work/release/vars.fd" 14
          else
            PHASE3_TAG=default PHASE3_TESTS=full \
              .github/scripts/ci_phase3.sh "$PWD/work/check.img" "$PWD/work/release/code.fd" "$PWD/work/release/vars.fd" 14
          fi

      - name: Check the Sharp resolution and its display scaling
        if: env.FW_OK == '1'
        timeout-minutes: 30
        run: |
          set +e
          PHASE3_TAG=sharp PHASE3_FB=2752x2064 PHASE3_TESTS=look \
            .github/scripts/ci_phase3.sh "$PWD/work/check.img" "$PWD/work/release/code.fd" "$PWD/work/release/vars.fd" 12

      - name: Check boot results
        if: always()
        continue-on-error: true
        run: |
          set +e +o pipefail
          for log in work/phase3_*.log; do
            [ -f "$log" ] || continue
            tag="$(basename "$log" .log)"
            shots="$(ls work/shots/${tag}_*.png 2>/dev/null | grep -v '_boot_0[0-8]min' | tr '\n' ' ')"
            .github/scripts/ci_show.sh "$log" $shots
          done

      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: provision-logs-and-screenshots
          path: |
            work/*.log
            work/*.png
            work/shots/*.png
            work/esd_images.txt
            work/SHA256SUMS.txt
          if-no-files-found: ignore
          retention-days: 14
