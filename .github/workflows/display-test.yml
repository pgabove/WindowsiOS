# Quick test of the resolution-aware firmware: boots the newest complete Windows image from the
# draft releases with the newest firmware build, at the Smooth and Sharp resolutions the app picks
# on an 11-inch iPad Pro (1208x834 and 2420x1668; the 13-inch gets 1376x1032 and 2752x2064), and
# shows screenshots. Nothing is published; the image stays inside the runner.

name: Display test

on:
  workflow_dispatch:
    inputs:
      smooth_fb:
        description: Smooth resolution (WxH)
        default: 1208x834
      sharp_fb:
        description: Sharp resolution (WxH)
        default: 2420x1668
  push:
    branches: [ ipad-26h2 ]
    paths:
      - .github/workflows/display-test.yml

permissions:
  contents: write
  actions: read

jobs:
  display:
    runs-on: xcode-27
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      GH_TOKEN: ${{ github.token }}
      CI_STATUS_BRANCH: ci-status-display
      SMOOTH_FB: ${{ inputs.smooth_fb || '1208x834' }}
      SHARP_FB: ${{ inputs.sharp_fb || '2420x1668' }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Build winvm and partstool
        run: |
          set -euo pipefail
          brew install libslirp pkg-config
          make -j"$(sysctl -n hw.ncpu)" all
          clang -O2 -Wall -Wextra -Iios/Sources/Native tools/partstool.c ios/Sources/Native/winios_parts.c \
            -lcompression -o build/partstool

      - name: Get the newest firmware build
        run: |
          set -euo pipefail
          id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow firmware.yml --status success -L 1 --json databaseId --jq '.[0].databaseId')"
          echo "firmware run $id"
          gh run download "$id" --repo "$GITHUB_REPOSITORY" -n winios-uefi-firmware -D work/fw
          cat work/fw/code.fd.sha256

      - name: Get the newest complete Windows image (draft release)
        run: |
          set -euo pipefail
          mkdir -p work/dl
          # A draft is complete when every part its manifest lists is uploaded. The newest one may
          # still be uploading: wait for it up to 20 minutes, then take the newest complete one.
          complete() {
            local rel="$1" mf parts have
            mf="$(gh api "repos/$GITHUB_REPOSITORY/releases/$rel/assets" --paginate \
                  --jq '.[] | select(.name == "windows11.hvsparse.parts" and .state == "uploaded") | .id')"
            [ -n "$mf" ] || return 1
            parts="$(gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$mf" | sed -n 's/^parts=//p')"
            have="$(gh api "repos/$GITHUB_REPOSITORY/releases/$rel/assets" --paginate \
                    --jq '[.[] | select((.name | test("^windows11\\.hvsparse\\.[0-9]{3}$")) and .state == "uploaded")] | length')"
            echo "release $rel: $have of ${parts:-?} parts uploaded"
            [ -n "$parts" ] && [ "$have" = "$parts" ]
          }
          drafts() {
            gh api "repos/$GITHUB_REPOSITORY/releases" \
              --jq '[.[] | select(.draft and (.tag_name | startswith("ipad-26h2-image-")))] | sort_by(.created_at) | reverse | .[].id'
          }
          rel=""
          for i in $(seq 1 40); do
            newest="$(drafts | head -n 1)"
            if complete "$newest"; then rel="$newest"; break; fi
            sleep 30
          done
          if [ -z "$rel" ]; then
            for r in $(drafts); do if complete "$r"; then rel="$r"; break; fi; done
          fi
          [ -n "$rel" ] || { echo "::error::no complete draft release"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/releases/$rel" --jq '"using: \(.name)"'
          gh api "repos/$GITHUB_REPOSITORY/releases/$rel/assets" --paginate --jq '.[] | "\(.id) \(.name)"' |
            while read -r aid name; do
              case "$name" in code.fd) continue;; esac
              gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$aid" > "work/dl/$name"
              echo "downloaded $name $(stat -f %z "work/dl/$name")"
            done
          build/partstool join work/dl windows11.hvsparse
          build/hvsparse unpack work/dl/windows11.hvsparse work/check.img
          rm -f work/dl/windows11.hvsparse

      - name: Boot at the Smooth resolution
        timeout-minutes: 30
        run: |
          PHASE3_TAG=smooth PHASE3_FB="$SMOOTH_FB" PHASE3_TESTS=look \
            .github/scripts/ci_phase3.sh "$PWD/work/check.img" "$PWD/work/fw/code.fd" "$PWD/work/dl/vars.fd" 10

      - name: Boot at the Sharp resolution
        timeout-minutes: 30
        run: |
          PHASE3_TAG=sharp PHASE3_FB="$SHARP_FB" PHASE3_TESTS=look \
            .github/scripts/ci_phase3.sh "$PWD/work/check.img" "$PWD/work/fw/code.fd" "$PWD/work/dl/vars.fd" 10

      - name: Results
        if: always()
        continue-on-error: true
        run: |
          set +e +o pipefail
          for log in work/phase3_*.log; do
            [ -f "$log" ] || continue
            tag="$(basename "$log" .log)"
            shots="$(ls work/shots/${tag}_*.png 2>/dev/null | tr '\n' ' ')"
            .github/scripts/ci_show.sh "$log" $shots
          done
